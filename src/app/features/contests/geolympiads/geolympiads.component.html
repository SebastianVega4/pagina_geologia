<section class="geolympiads-page">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">

    <div class="mb-12">
      <a routerLink="/" class="back-link">
        <lucide-angular [img]="icons.ChevronLeft" class="w-5 h-5"></lucide-angular>
        Volver al inicio
      </a>
    </div>

    <div class="text-center mb-12">
      <div class="badge-tag">
        <lucide-angular [img]="icons.Trophy" class="w-4 h-4"></lucide-angular>
        Geolimpiadas 2026
      </div>

      <h1 class="page-title">
        Geolimpiadas <span class="accent">2026</span>
      </h1>

      <p class="page-subtitle">
        Prepárate para el desafío intelectual más grande de las geociencias.
        Estamos afinando los detalles para una competencia épica que pondrá a prueba tus conocimientos y habilidades.
      </p>
    </div>

    <!-- Viewer: Desktop = deck, Mobile = single image -->
    <div class="viewer-wrap" tabindex="0" (keydown)="onKeydown($event)">

      <!-- HUD (both views) -->
      <div class="viewer-hud">
        <span class="hud-count">{{ pad(currentIdx + 1) }} / {{ pad(images.length) }}</span>
        <div class="hud-bar"><i [style.width.%]="((currentIdx + 1) / images.length) * 100"></i></div>
        <div class="viewer-navs">
          <button class="viewer-nav" (click)="prevImage()" aria-label="Anterior">&lsaquo;</button>
          <button class="viewer-nav" (click)="nextImage()" aria-label="Siguiente">&rsaquo;</button>
        </div>
      </div>

      <!-- Mobile: single image -->
      <div class="mobile-stage">
        <img [src]="images[currentIdx].src" [alt]="images[currentIdx].alt">
      </div>

      <!-- Desktop: deck carousel -->
      <div class="deck-stage">
        <div class="deck-cards" id="geo-deck">
          <div
            *ngFor="let img of images; let i = index"
            class="geo-card"
            [class.is-hero]="i === currentIdx"
            (click)="onCardClick(i)">
            <img [src]="img.src" [alt]="img.alt" loading="lazy">
          </div>
        </div>
      </div>

    </div>

  </div>
</section>
