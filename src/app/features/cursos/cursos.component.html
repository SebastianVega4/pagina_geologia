<section class="cursos-section pt-32 pb-24 bg-brand-light dark:bg-brand-dark min-h-screen transition-colors duration-300">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <!-- Header Navigation -->
    <div class="mb-8">
      <a routerLink="/evento" class="inline-flex items-center gap-2 text-brand-secondary hover:translate-x-[-4px] transition-transform font-bold text-sm">
        <lucide-angular [img]="icons.ChevronLeft" class="w-4 h-4"></lucide-angular>
        Volver a Evento
      </a>
    </div>

    <!-- Section Header -->
    <div class="mb-12">
      <p class="text-brand-secondary font-bold tracking-widest uppercase text-xs mb-3">Pre-Semana</p>
      <h1 class="text-3xl md:text-5xl font-extrabold text-brand-primary dark:text-white leading-tight mb-4">
        Cursos Especializados
      </h1>
      <p class="max-w-3xl text-gray-600 dark:text-gray-400 text-base md:text-lg leading-relaxed">
        Explora la programación académica y guías temáticas de los cursos que se llevarán a cabo. Selecciona un curso de la lista para visualizar su folleto técnico completo.
      </p>
    </div>

    <!-- Mobile Dropdown Selector (visible on small screens) -->
    <div class="block lg:hidden mb-6">
      <label for="course-select" class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Seleccionar Curso:</label>
      <select id="course-select"
              (change)="onMobileSelectChange($event)"
              class="w-full bg-white dark:bg-brand-primary text-brand-primary dark:text-white border border-gray-200 dark:border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-secondary">
        <option *ngFor="let c of cursos" [value]="c.url" [selected]="c.url === selectedCurso.url">
          {{ c.name }}
        </option>
      </select>
    </div>

    <!-- Main Workspace Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

      <!-- Left Sidebar (Desktop only) -->
      <div class="hidden lg:flex lg:col-span-4 flex-col gap-3 max-h-[750px] overflow-y-auto pr-2 custom-scrollbar">
        <button *ngFor="let c of cursos"
                (click)="selectCurso(c)"
                [ngClass]="selectedCurso.url === c.url 
                           ? 'bg-brand-secondary text-white border-brand-secondary shadow-lg shadow-brand-secondary/20' 
                           : 'bg-white dark:bg-brand-primary text-brand-primary dark:text-gray-300 border-gray-100 dark:border-white/5 hover:border-brand-secondary/30'"
                class="text-left p-5 rounded-2xl border transition-all duration-300 flex items-start gap-4 hover:-translate-y-0.5">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0"
               [ngClass]="selectedCurso.url === c.url ? 'bg-white/20 text-white' : 'bg-brand-light dark:bg-brand-dark text-brand-secondary'">
            <lucide-angular [img]="icons.BookOpen" class="w-5 h-5"></lucide-angular>
          </div>
          <div>
            <h3 class="text-sm font-extrabold leading-snug line-clamp-2 mb-1">
              {{ c.name }}
            </h3>
            <p class="text-xs line-clamp-2"
               [ngClass]="selectedCurso.url === c.url ? 'text-white/80' : 'text-gray-500 dark:text-gray-400'">
              {{ c.description }}
            </p>
          </div>
        </button>
      </div>

      <!-- Right Viewer (Desktop & Mobile) -->
      <div class="lg:col-span-8">
        <div class="pdf-container rounded-3xl overflow-hidden border border-gray-200 dark:border-white/10 shadow-2xl bg-white dark:bg-brand-primary relative">

          <!-- Loading Skeleton -->
          <div *ngIf="!isPreviewLoaded" class="pdf-skeleton absolute inset-0 flex flex-col items-center justify-center gap-4 bg-white dark:bg-brand-primary z-20 py-32">
            <div class="w-16 h-16 rounded-2xl bg-gray-100 dark:bg-white/5 flex items-center justify-center animate-pulse">
              <lucide-angular [img]="icons.FileText" class="w-8 h-8 text-gray-400 dark:text-gray-500"></lucide-angular>
            </div>
            <div class="text-center gap-1 flex flex-col">
              <p class="text-gray-500 dark:text-gray-400 font-bold animate-pulse text-sm">Cargando documento...</p>
              <p class="text-gray-400 dark:text-gray-500 text-xs">Preparando visor de PDF</p>
            </div>
          </div>

          <!-- Top Action Bar -->
          <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100 dark:border-white/5 bg-gray-50/50 dark:bg-white/5 relative z-30">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-8 h-8 bg-brand-secondary/10 rounded-lg flex items-center justify-center shrink-0">
                <lucide-angular [img]="icons.FileText" class="w-4 h-4 text-brand-secondary"></lucide-angular>
              </div>
              <span class="text-xs font-bold text-brand-primary dark:text-white truncate pr-4">
                {{ selectedCurso.filename }}
              </span>
            </div>
            <div class="flex items-center gap-2 shrink-0">
              <!-- Small Elegant Download Button -->
              <a [href]="selectedCurso.url"
                 [download]="selectedCurso.filename"
                 class="inline-flex items-center justify-center p-2 bg-brand-secondary/10 hover:bg-brand-secondary/20 text-brand-secondary rounded-lg transition-colors border border-brand-secondary/20"
                 title="Descargar archivo">
                <lucide-angular [img]="icons.Download" class="w-4 h-4"></lucide-angular>
              </a>
              <a [href]="selectedCurso.url"
                 target="_blank"
                 class="inline-flex items-center justify-center p-2 bg-brand-secondary/10 hover:bg-brand-secondary/20 text-brand-secondary rounded-lg transition-colors border border-brand-secondary/20"
                 title="Ver pantalla completa">
                <lucide-angular [img]="icons.ExternalLink" class="w-4 h-4"></lucide-angular>
              </a>
            </div>
          </div>

          <!-- PDF Embed Frame -->
          <div class="aspect-[21/29.7] w-full min-h-[500px] md:min-h-[700px] relative z-10">
            <iframe
              [src]="selectedCurso.url | safe:'resourceUrl'"
              (load)="onIframeLoad()"
              class="w-full h-full border-0"
              allow="autoplay"
              [title]="selectedCurso.name">
            </iframe>
          </div>

        </div>
      </div>

    </div>

  </div>
</section>
