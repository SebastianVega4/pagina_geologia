<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma de Ponencias — XVII STG 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0B1220;
    --night-2:#101A2E;
    --gold:#D4A017;
    --teal:#2AAFB0;
    --amber:#E07B2A;
    --card-bg:#16223B;
    --border:#283655;
    --text:#E7ECF5;
    --text-dim:#9AA7C2;
    --green:#3FBF6B;
    --gray:#4A5675;
  }
  body.day-mode{
    --night:#F0F4FA;
    --night-2:#E4ECF5;
    --card-bg:#FFFFFF;
    --border:#C8D4E8;
    --text:#16223B;
    --text-dim:#5A6A82;
    --green:#1A8C42;
    --gray:#7A8699;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'DM Sans',sans-serif;
    background:var(--night);
    color:var(--text);
    padding:24px;
    transition:background .25s,color .25s;
  }
  h1{
    font-family:'Playfair Display',serif;
    font-size:28px;
    margin:0 0 4px;
    color:var(--gold);
  }
  .subtitle{
    color:var(--text-dim);
    font-size:14px;
    margin:0 0 18px;
  }

  /* ===== Tabs ===== */
  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:10px;
    flex-wrap:wrap;
  }
  .tab-btn{
    background:var(--night-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:10px 16px;
    border-radius:8px 8px 0 0;
    font-family:'DM Mono',monospace;
    font-size:12px;
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .tab-btn:hover{color:var(--text);}
  .tab-btn.active{
    background:var(--card-bg);
    color:var(--gold);
    border-color:var(--gold);
    border-bottom:2px solid var(--card-bg);
    font-weight:700;
  }
  .tab-desc{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 14px;
    font-size:12.5px;
    color:var(--text-dim);
    margin-bottom:16px;
  }
  .tab-desc b{color:var(--gold);}

  /* ===== Toolbar / legend ===== */
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
  }
  .legend{
    display:flex;
    gap:14px;
    font-size:12px;
    color:var(--text-dim);
    font-family:'DM Mono',monospace;
    flex-wrap:wrap;
  }
  .legend span{display:flex;align-items:center;gap:6px;}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block;}
  .dot.confirmado{background:var(--green);}
  .dot.parcial{background:var(--amber);}
  .dot.pendiente{background:var(--gray);}
  .dot.tbd{background:transparent;border:1px dashed var(--text-dim);}
  .dot.cm{background:var(--gold);}
  .dot.dup{background:#C0392B;}

  /* ===== Stats ===== */
  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:10px;margin-bottom:16px;
  }
  .stat{
    background:var(--card-bg);border:1px solid var(--border);border-radius:10px;
    padding:14px 12px;text-align:center;
    transition:border-color .15s,transform .1s;
  }
  .stat:hover{border-color:var(--gold);transform:translateY(-1px);}
  .stat .num{font-family:'Playfair Display',serif;font-size:26px;color:var(--gold);line-height:1;}
  .stat .lbl{font-size:10.5px;color:var(--text-dim);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.5px;margin-top:6px;line-height:1.35;}

  /* ===== Theme toggle ===== */
  .theme-btn{
    background:var(--card-bg);border:1px solid var(--border);border-radius:20px;
    color:var(--text-dim);padding:6px 14px;cursor:pointer;font-family:'DM Mono',monospace;
    font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap;
    transition:border-color .15s,color .15s,background .25s;
  }
  .theme-btn:hover{border-color:var(--gold);color:var(--gold);}
  .theme-icon{font-size:14px;}

  /* ===== Grid / calendar ===== */
  .day-panel{display:none;}
  .day-panel.active{display:block;}

  .grid-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;}
  table.cal{
    width:100%;border-collapse:collapse;min-width:760px;
    font-size:13px;table-layout:fixed;
  }
  table.cal th{
    background:var(--night-2);color:var(--gold);
    font-family:'DM Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    padding:10px 8px;border-bottom:2px solid var(--border);text-align:left;position:sticky;top:0;
  }
  table.cal th.time-col{width:92px;}
  .room-name{font-weight:700;}
  .room-theme{font-size:9px;color:var(--teal);font-weight:400;text-transform:none;letter-spacing:0;margin-top:3px;line-height:1.3;opacity:.85;}
  table.cal td{
    border:1px solid var(--border);vertical-align:top;padding:0;
  }
  table.cal td.time-cell{
    background:var(--night-2);color:var(--text-dim);
    font-family:'DM Mono',monospace;font-size:11.5px;font-weight:700;
    text-align:center;vertical-align:middle;white-space:nowrap;width:92px;padding:4px 6px;
  }
  .cell{
    padding:8px 10px;height:100%;min-height:64px;display:flex;flex-direction:column;gap:4px;
    cursor:pointer;transition:.12s;
  }
  .cell:hover{filter:brightness(1.15);}
  .cell.empty{cursor:default;color:var(--text-dim);font-style:italic;font-size:12px;
    display:flex;align-items:center;justify-content:center;opacity:.5;}
  .cell .title{font-size:12.5px;line-height:1.3;}
  .cell .meta{font-size:10.5px;color:var(--text-dim);font-family:'DM Mono',monospace;}
  .cell.confirmado{background:rgba(63,191,107,0.16);border-left:4px solid var(--green);}
  table.cal th.auditorio-col{width:230px;}
  .cell-stack{display:flex;flex-direction:column;gap:1px;height:100%;}
  .cell-stack .cell{min-height:0;padding:6px 8px;gap:2px;}
  .cell-stack .cell .title{font-size:11.5px;}
  .cell-stack .cell + .cell{border-top:1px solid var(--border);}
  .auditorio-cell{padding:12px 14px;background:rgba(212,160,23,0.10);border-right:3px solid var(--gold);height:100%;}
  .auditorio-cell .au-item{margin-bottom:12px;}
  .auditorio-cell .au-item:last-child{margin-bottom:0;}
  .auditorio-cell .au-code{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--gold);text-transform:uppercase;}
  .auditorio-cell .au-title{font-family:'Playfair Display',serif;color:var(--text);font-size:13px;line-height:1.35;margin-top:3px;}
  .auditorio-cell .au-speaker{font-size:11px;color:var(--text-dim);margin-top:3px;}
  .auditorio-cell .au-tbd{font-style:italic;opacity:.7;}
  .auditorio-cell .au-dash{color:var(--text-dim);font-style:italic;font-size:11px;opacity:.5;display:flex;align-items:center;justify-content:center;height:100%;}
  .poster-merged-cell{padding:8px 10px;font-size:11.5px;color:var(--teal);}
  .poster-merged-cell .pm-title{font-family:'Playfair Display',serif;font-size:12.5px;}
  .poster-merged-cell details{margin-top:4px;}
  .poster-merged-cell summary{cursor:pointer;color:var(--teal);font-family:'DM Mono',monospace;font-size:10.5px;}
  .poster-merged-cell .poster-list{margin-top:6px;max-height:200px;overflow-y:auto;font-size:11px;line-height:1.4;}
  .poster-merged-cell .poster-list .p-item{padding:4px 0;border-bottom:1px solid var(--border);}
  .cell.parcial{background:rgba(224,123,42,0.16);border-left:4px solid var(--amber);}
  .cell.pendiente{background:rgba(74,86,117,0.18);border-left:4px solid var(--gray);}
  .cell.tbd{background:transparent;border-left:4px dashed var(--text-dim);color:var(--text-dim);font-style:italic;}
  .cell.dup .title::after{content:" 🔁";}

  /* CM banner row */
  tr.cm-row td{
    background:linear-gradient(90deg, rgba(212,160,23,0.18), rgba(212,160,23,0.05));
    border-left:4px solid var(--gold);padding:10px 14px;
  }
  tr.cm-row .cm-title{font-family:'Playfair Display',serif;color:var(--gold);font-size:14px;}
  tr.cm-row .cm-meta{font-size:11.5px;color:var(--text-dim);font-family:'DM Mono',monospace;margin-top:2px;}
  tr.cm-row.cm-tbd td{background:transparent;border-left:4px dashed var(--gold);}
  tr.cm-row.cm-tbd .cm-title{color:var(--text-dim);font-style:italic;}

  /* ===== Modal ===== */
  .modal-bg{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);
    align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal-bg.show{display:flex;}
  .modal{
    background:var(--card-bg);border:1px solid var(--border);border-radius:10px;
    padding:22px;max-width:520px;width:100%;
  }
  .modal h3{font-family:'Playfair Display',serif;color:var(--text);font-size:18px;margin:0 0 10px;line-height:1.35;}
  .modal .badge{
    display:inline-block;font-family:'DM Mono',monospace;font-size:11px;
    padding:3px 10px;border-radius:12px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;
  }
  .modal .badge.confirmado{background:rgba(63,191,107,0.2);color:var(--green);border:1px solid var(--green);}
  .modal .badge.parcial{background:rgba(224,123,42,0.2);color:var(--amber);border:1px solid var(--amber);}
  .modal .badge.pendiente{background:rgba(74,86,117,0.25);color:var(--text-dim);border:1px solid var(--gray);}
  .modal .row{margin:6px 0;font-size:13px;color:var(--text-dim);}
  .modal .row b{color:var(--text);font-weight:500;}
  .modal .close{
    margin-top:16px;background:var(--night-2);border:1px solid var(--border);color:var(--text);
    padding:8px 16px;border-radius:6px;cursor:pointer;font-family:'DM Mono',monospace;font-size:12px;
  }
  .modal .close:hover{border-color:var(--gold);color:var(--gold);}

  /* Poster session row */
  tr.poster-row td{
    background:linear-gradient(90deg, rgba(42,175,176,0.16), rgba(42,175,176,0.05));
    border-left:4px solid var(--teal);padding:10px 14px;
  }
  tr.poster-row .poster-title{font-family:'Playfair Display',serif;color:var(--teal);font-size:14px;}
  tr.poster-row .poster-meta{font-size:11.5px;color:var(--text-dim);font-family:'DM Mono',monospace;margin-top:2px;}
  tr.poster-row details{margin-top:8px;}
  tr.poster-row summary{cursor:pointer;color:var(--teal);font-family:'DM Mono',monospace;font-size:11.5px;}
  tr.poster-row .poster-list{margin-top:8px;max-height:280px;overflow-y:auto;font-size:12px;line-height:1.5;padding-right:6px;}
  tr.poster-row .poster-list .p-item{padding:5px 0;border-bottom:1px solid var(--border);}
  tr.poster-row .poster-list .p-item b{color:var(--text);font-weight:500;}
  tr.poster-row .poster-counts{font-size:11px;color:var(--text-dim);font-family:'DM Mono',monospace;margin-top:4px;}
  .dot.poster{background:var(--teal);}

  /* Panel row */
  tr.panel-row td{
    background:linear-gradient(90deg, rgba(224,123,42,0.16), rgba(224,123,42,0.05));
    border-left:4px solid var(--amber);padding:10px 14px;
  }
  tr.panel-row .panel-title{font-family:'Playfair Display',serif;color:var(--amber);font-size:14px;}
  tr.panel-row .panel-meta{font-size:11.5px;color:var(--text-dim);font-family:'DM Mono',monospace;margin-top:2px;}
  .dot.panel{background:var(--amber);border-radius:50%;}

  /* Info row (registro/bienvenida/break/almuerzo/cierre/sgc/evento) */
  tr.info-row td{padding:8px 14px;border-left:4px solid var(--text-dim);}
  tr.info-row .info-title{font-family:'DM Sans',sans-serif;font-weight:700;font-size:13px;color:var(--text);}
  tr.info-row .info-meta{font-size:11px;color:var(--text-dim);font-family:'DM Mono',monospace;margin-top:2px;}
  tr.info-row.cat-registro td, tr.info-row.cat-break td{background:rgba(224,123,42,0.12);border-left-color:var(--amber);}
  tr.info-row.cat-bienvenida td{background:rgba(212,160,23,0.18);border-left-color:var(--gold);}
  tr.info-row.cat-bienvenida .info-title{color:var(--gold);}
  tr.info-row.cat-almuerzo td{background:rgba(231,236,245,0.06);border-left-color:var(--text-dim);}
  tr.info-row.cat-sgc td{background:rgba(74,86,117,0.18);border-left-color:var(--gray);border-left-style:dashed;}
  tr.info-row.cat-cierre td{background:rgba(63,191,107,0.14);border-left-color:var(--green);}
  tr.info-row.cat-evento td{background:rgba(42,175,176,0.14);border-left-color:var(--teal);}
  tr.info-row.cat-geolimpiadas td{background:repeating-linear-gradient(135deg, rgba(42,175,176,0.14) 0 10px, rgba(42,175,176,0.06) 10px 20px);border-left-color:var(--teal);border-left-style:dotted;}

  /* ===== Dashboard (Estado Actual) ===== */
  .dashboard{display:flex;flex-direction:column;gap:18px;}
  .db-section{
    background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:16px 18px;
  }
  .db-section h3{
    font-family:'Playfair Display',serif;color:var(--gold);font-size:16px;margin:0 0 12px;
  }
  .db-section .stats{margin-bottom:10px;}
  .db-row{font-size:13px;color:var(--text);margin:4px 0;}
  .db-note{color:var(--text-dim);font-size:11.5px;}
  .db-subtitle{
    font-family:'DM Mono',monospace;font-size:11px;color:var(--text-dim);text-transform:uppercase;
    letter-spacing:.5px;margin-top:12px;margin-bottom:6px;
  }
  .db-pills{display:flex;flex-wrap:wrap;gap:6px;}
  .db-pill{
    background:var(--night-2);border:1px solid var(--border);border-radius:12px;
    padding:4px 10px;font-size:12px;color:var(--text-dim);font-family:'DM Mono',monospace;
  }

  footer{margin-top:24px;font-size:11.5px;color:var(--text-dim);font-family:'DM Mono',monospace;}

  /* ===== Horario General ===== */
  .hh{padding:10px 8px;text-align:center;font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.5px;border-right:1px solid var(--border);}
  .hblk{margin:2px 3px;border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden;line-height:1.3;}
  .hblk .hn{font-weight:700;font-size:11.5px;letter-spacing:.2px;}
  .hblk .hs{font-size:10px;opacity:.75;margin-top:3px;}
  .hb-reg{background:rgba(224,123,42,.18);border:1px solid var(--amber);color:var(--amber);}
  .hb-ap{background:rgba(212,160,23,.22);border:1px solid var(--gold);color:var(--gold);}
  .hb-geo{background:rgba(212,160,23,.15);border:1px solid var(--gold);color:var(--gold);}
  .hb-cm{background:rgba(224,123,42,.2);border:1px solid var(--amber);color:var(--amber);overflow:visible;z-index:2;}
  .hb-pan{background:rgba(42,175,176,.14);border:1px dashed var(--teal);color:var(--teal);}
  .hb-alm{background:rgba(231,236,245,.06);border:1px solid var(--border);color:var(--text-dim);}
  .hb-brk{background:rgba(74,86,117,.18);border:1px dashed var(--gray);color:var(--text-dim);font-style:italic;font-size:10.5px;}
  .hb-sgc{background:rgba(63,191,107,.2);border:1px solid var(--green);color:var(--green);}
  .hb-cie{background:rgba(63,191,107,.22);border:1px solid var(--green);color:var(--green);}
  .hblk .ht{font-family:'DM Mono',monospace;font-size:8px;opacity:.6;letter-spacing:.2px;margin-bottom:2px;}
  .hb-pon{background:rgba(42,175,176,.14);border:1px solid var(--teal);color:var(--teal);}
  .hb-scg{background:rgba(42,200,140,.18);border:1px solid #2AC88C;color:#2AC88C;}
</style>
</head>
<body>

<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px;flex-wrap:wrap;">
  <div>
    <h1>Cronograma de Ponencias — XVII STG 2026</h1>
    <p class="subtitle">UPTC Seccional Sogamoso · 19–21 ago 2026 · Mié–Vie salas 201–206</p>
  </div>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Cambiar tema">
    <span class="theme-icon" id="themeIcon">☀️</span>
    <span id="themeLabel">Modo día</span>
  </button>
</div>

<div class="stats">
  <div class="stat"><div class="num">72</div><div class="lbl">Ponencias</div></div>
  <div class="stat"><div class="num">15</div><div class="lbl">Charlas magistrales</div></div>
  <div class="stat"><div class="num">77</div><div class="lbl">Pósters</div></div>
</div>

<div class="toolbar">
  <div class="legend">
    <span><span class="dot confirmado"></span> Ponencia</span>
    <span><span class="dot cm"></span> Charla magistral</span>
    <span><span class="dot panel"></span> Panel</span>
    <span><span class="dot poster"></span> Pósters</span>
  </div>
</div>

<div class="tabs" id="tabs"></div>

<div id="panels"></div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <div id="modalBadge" class="badge"></div>
    <h3 id="modalTitle"></h3>
    <div class="row" id="modalRoom"></div>
    <div class="row" id="modalAuthors"></div>
    <button class="close" onclick="closeModal()">Cerrar</button>
  </div>
</div>

<footer></footer>

<script>
const STATUS_LABEL = {
  confirmado: 'Confirmada — contacto inscrito',
  parcial: 'Confirmada parcial — coautor inscrito, contacto pendiente',
  pendiente: 'Pendiente — sin inscripción registrada',
  tbd: 'Cupo reservado (TBD)'

const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function statCard(num, lbl){
  return `<div class="stat"><div class="num">${escapeHtml(String(num))}</div><div class="lbl">${escapeHtml(lbl)}</div></div>`;
}

function renderHorario(){
  function r(t){const[h,m]=t.split(':').map(Number);return(h-8)*60+m+1;}
  function fmt(t){
    const[h,m]=t.split(':').map(Number);
    const a=h<12?'AM':'PM';const hh=h>12?h-12:(h===0?12:h);
    return hh+':'+(m<10?'0':'')+m+'\u00a0'+a;
  }
  function blk(col,t1,t2,cat,name,sub){
    const cs=Array.isArray(col)?`${col[0]} / span ${col[1]}`:`${col}`;
    return `<div class="hblk ${cat}" style="grid-column:${cs};grid-row:${r(t1)}/${r(t2)}">
      <div class="ht">${fmt(t1)}&thinsp;–&thinsp;${fmt(t2)}</div>
      <div class="hn">${name}</div>${sub?`<div class="hs">${sub}</div>`:''}
    </div>`;
  }
  // Genera bloques individuales por CM — título prominente, código como etiqueta pequeña
  function cmBlks(col,dayId,excludeCodes){
    const exc=new Set(excludeCodes||[]);
    const day=DAYS.find(d=>d.id===dayId);
    if(!day) return '';
    return day.rows.flatMap(row=>(row.auditorio?.cms||[]).map(cm=>{
      if(exc.has(cm.code)) return '';
      const pts=cm.time.split(/[^\d:]+/);
      const[t1,t2]=[pts[0],pts[1]];
      if(!t1||!t2) return '';
      const cs=Array.isArray(col)?`${col[0]} / span ${col[1]}`:`${col}`;
      const spOk=cm.speaker&&cm.speaker!=='Por confirmar';
      const title=cm.title;
      return `<div class="hblk hb-cm" style="grid-column:${cs};grid-row:${r(t1)}/${r(t2)};justify-content:flex-start;align-items:flex-start;text-align:left;">
        <div class="ht" style="width:100%;text-align:left">${fmt(t1)}\u2009\u2013\u2009${fmt(t2)}</div>
        <div style="font-size:7px;opacity:.4;font-family:'DM Mono',monospace;letter-spacing:.2px;margin-bottom:1px">${escapeHtml(cm.code)}</div>
        <div style="font-size:9px;font-weight:700;line-height:1.25;color:var(--amber)">${escapeHtml(title)}</div>
        ${spOk?`<div style="font-size:7.5px;opacity:.6;font-style:italic;margin-top:2px;line-height:1.2">${escapeHtml(cm.speaker)}</div>`:''}
      </div>`;
    })).join('');
  }

  const GC='55px 1fr 1fr 1fr 1fr 1fr 1fr 1fr';
  const tls=['8:00','8:30','9:00','9:30','10:00','10:30','11:00','11:30',
    '12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30',
    '16:00','16:30','17:00','17:30','18:00','18:30'];
  const tlHtml=tls.map(t=>`<div style="grid-column:1;grid-row:${r(t)}/${r(t)+10};
    font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);
    display:flex;align-items:flex-start;justify-content:flex-end;
    padding-right:6px;padding-top:2px;border-right:1px solid var(--border);">${t}</div>`).join('');

  // ── MIERCOLES cols 2=CMs·Actividades · 3=Posters·Ponencias ──────────────────────
  const mie=[
    blk([2,2],'8:00','9:00','hb-reg','REGISTRO','Entrega primer refrigerio'),
    blk([2,2],'9:00','10:00','hb-ap','BIENVENIDA','Apertura del evento'),
    blk(2,'10:00','12:30','hb-geo','GEOLIMPIADAS',''),
    blk(3,'10:00','12:30','hb-geo','POSTERS','46 turnos · 2 salones'),
    blk([2,7],'12:30','14:00','hb-alm','ALMUERZO',''),
    cmBlks(2,'mie'),
    blk(3,'14:10','15:40','hb-pon','PONENCIAS','18 ponencias · 6 salas'),
    blk([2,2],'15:50','16:20','hb-brk','BREAK','Entrega segundo refrigerio'),
    blk(3,'16:30','18:00','hb-pon','PONENCIAS','18 ponencias · 6 salas'),
    blk([2,2],'18:00','19:00','hb-cie','TERMALES','Máx. 7:00 PM'),
  ].join('');

  // ── SGC Servicio Geológico Colombiano (col 4) · dividido en almuerzo ───────────
  const sgc=[
    blk(4,'8:10','12:30','hb-sgc','SGC','Servicio Geológico Colombiano<br>1 salón Bienestar'),
    blk(4,'14:00','19:00','hb-sgc','SGC',''),
  ].join('');

  // ── JUEVES cols 5=CMs·Actividades · 6=Posters·Ponencias ───────────────────────
  const jue=[
    cmBlks(5,'jue'),
    blk(6,'8:10','10:20','hb-geo','POSTERS','31 turnos · 1 salón'),
    blk([5,2],'10:30','11:00','hb-brk','BREAK','Entrega tercer refrigerio'),
    blk([5,2],'11:00','12:30','hb-pan','GEOLOGÍA EN VIVO','Dos Expertos, Un Viaje al Corazón de la Tierra'),
    blk([5,2],'14:10','15:40','hb-pan','PANEL - GESTIÓN DEL RIESGO','Panel de Discusión'),
    blk([5,2],'15:50','16:20','hb-brk','BREAK','Entrega cuarto refrigerio'),
    blk(6,'16:30','18:00','hb-pon','PONENCIAS','18 ponencias · 6 salas'),
    blk([5,2],'18:00','18:40','hb-cie','CANELAZO',''),
  ].join('');

  // ── VIERNES cols 7=CMs·Actividades · 8=Ponencias AM / SCG PM ─────────────
  const vie=[
    cmBlks(7,'vie'),
    blk(8,'8:10','10:30','hb-pon','PONENCIAS','18 ponencias · 6 salas'),
    blk([7,2],'10:30','11:00','hb-brk','BREAK','Entrega quinto refrigerio'),
    blk([7,2],'11:00','12:30','hb-pan','PANEL · ANH','Energías, territorio y decisiones'),
    blk(8,'14:10','16:20','hb-scg','SCG','Sociedad Colombiana<br>de Geotecnia<br>1 salón Bienestar'),
    blk([7,2],'16:20','19:00','hb-cie','EVENTO DE CIERRE','4:20 – 7:00 PM'),
    blk([7,2],'19:00','19:30','hb-cie','FIESTA FINAL','7:00 PM →'),
  ].join('');

  const hdrMain=`<div style="display:grid;grid-template-columns:${GC};
    background:var(--night-2);border-bottom:2px solid var(--border);min-width:840px;">
    <div class="hh">Hora</div>
    <div class="hh" style="grid-column:2/span 2">Miércoles 19 Ago</div>
    <div class="hh" style="grid-column:4/span 3">Jueves 20 Ago</div>
    <div class="hh" style="grid-column:7/span 2">Viernes 21 Ago</div>
  </div>`;

  const hdrSub=`<div style="display:grid;grid-template-columns:${GC};
    background:var(--night-2);border-bottom:1px solid var(--border);min-width:840px;">
    <div></div>
    <div class="hh" style="font-size:7.5px;padding:3px 5px;letter-spacing:0;color:var(--amber);opacity:.8">Charlas Magistrales</div>
    <div class="hh" style="font-size:7.5px;padding:3px 5px;letter-spacing:0;color:var(--teal);opacity:.8">Pósters · Ponencias</div>
    <div class="hh" style="font-size:6.5px;padding:3px 3px;letter-spacing:0;color:var(--green);opacity:.8;line-height:1.3;">SERVICIO<br>GEOLÓGICO<br>COLOMBIANO</div>
    <div class="hh" style="font-size:7.5px;padding:3px 5px;letter-spacing:0;color:var(--amber);opacity:.8">Charlas Magistrales</div>
    <div class="hh" style="font-size:7.5px;padding:3px 5px;letter-spacing:0;color:var(--teal);opacity:.8">Pósters · Ponencias</div>
    <div class="hh" style="font-size:7.5px;padding:3px 5px;letter-spacing:0;color:var(--amber);opacity:.8">Charlas Magistrales</div>
    <div class="hh" style="font-size:7.5px;padding:3px 5px;letter-spacing:0;color:var(--teal);opacity:.8">Ponencias · SCG PM</div>
  </div>`;

  return `<div style="overflow-x:auto;border:1px solid var(--border);border-radius:8px;">
    ${hdrMain}${hdrSub}
    <div style="display:grid;grid-template-columns:${GC};
      grid-template-rows:repeat(700,2px);position:relative;min-width:840px;">
      ${tlHtml}${mie}${sgc}${jue}${vie}
    </div>
  </div>`;
}

DAYS.forEach((day, idx)=>{
  // tab button
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (idx===0?' active':'');
  btn.textContent = day.label;
  btn.onclick = ()=>selectDay(idx);
  tabsEl.appendChild(btn);

  // panel
  const panel = document.createElement('div');
  panel.className = 'day-panel' + (idx===0?' active':'');
  panel.id = 'panel-'+day.id;

  if(day.type==='dashboard'){
    panel.innerHTML = renderHorario();
    panelsEl.appendChild(panel);
    return;
  }

  const wrap = document.createElement('div');
  wrap.className = 'grid-wrap';
  const table = document.createElement('table');
  table.className = 'cal';

  // header
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  trh.innerHTML = '<th class="time-col">Hora</th>' + (day.sgcColumn ? '<th style="width:64px;background:rgba(63,191,107,0.08);color:var(--green);font-size:9px;">SGC</th>' : '') + '<th class="auditorio-col">Auditorio</th>' + day.rooms.map(r=>`<th><div class="room-name">${escapeHtml(r)}</div><div class="room-theme">${escapeHtml((day.themes||{})[r]||'')}</div></th>`).join('');
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  function sgcTd(row){
    const td = document.createElement('td');
    td.rowSpan = row.sgcSpan;
    td.style.background = 'rgba(63,191,107,0.06)';
    td.style.borderRight = '2px solid var(--green)';
    td.style.verticalAlign = 'middle';
    td.style.textAlign = 'center';
    td.style.padding = '8px 4px';
    td.innerHTML = `<div style="font-family:'Playfair Display',serif;color:var(--green);font-size:11px;">SGC</div>
      <div style="font-size:8px;color:var(--text-dim);margin-top:4px;line-height:1.25;">Servicio Geológico Colombiano — programación propia, 1 salón de Bienestar</div>`;
    return td;
  }
  day.rows.forEach(row=>{
    const tr = document.createElement('tr');
    if(row.type==='panel'){
      tr.className = 'panel-row';
      if(day.sgcColumn){
        const tdTime = document.createElement('td');
        tdTime.className = 'time-cell';
        tdTime.textContent = row.time;
        tr.appendChild(tdTime);
        if(row.sgc==='start') tr.appendChild(sgcTd(row));
        const td = document.createElement('td');
        td.colSpan = day.rooms.length + 1 + (row.sgc ? 0 : 1);
        td.innerHTML = `<div class="panel-title">${escapeHtml(row.title)}</div>
                        <div class="panel-meta">${escapeHtml(row.note)}</div>`;
        tr.appendChild(td);
      } else {
        const td = document.createElement('td');
        td.colSpan = day.rooms.length + 2;
        td.innerHTML = `<div class="panel-meta">${escapeHtml(row.time)} · PANEL</div>
                        <div class="panel-title">${escapeHtml(row.title)}</div>
                        <div class="panel-meta">${escapeHtml(row.note)}</div>`;
        tr.appendChild(td);
      }
    } else if(row.type==='info'){
      tr.className = 'info-row cat-' + escapeHtml(row.category||'');
      if(day.sgcColumn){
        const tdTime = document.createElement('td');
        tdTime.className = 'time-cell';
        tdTime.textContent = row.time;
        tr.appendChild(tdTime);
        if(row.sgc==='start') tr.appendChild(sgcTd(row));
        const td = document.createElement('td');
        td.colSpan = day.rooms.length + 1 + (row.sgc ? 0 : 1);
        td.innerHTML = `<div class="info-title">${escapeHtml(row.title)}</div>`
                        + (row.note ? `<div class="info-meta">${escapeHtml(row.note)}</div>` : '');
        tr.appendChild(td);
      } else {
        const td = document.createElement('td');
        td.colSpan = day.rooms.length + 2;
        td.innerHTML = `<div class="info-title">${escapeHtml(row.time)} · ${escapeHtml(row.title)}</div>`
                        + (row.note ? `<div class="info-meta">${escapeHtml(row.note)}</div>` : '');
        tr.appendChild(td);
      }
    } else if(row.type==='block'){
      tr.className = 'block-row';
      const tdTime = document.createElement('td');
      tdTime.className = 'time-cell';
      tdTime.textContent = row.time;
      tr.appendChild(tdTime);
      if(row.sgc==='start') tr.appendChild(sgcTd(row));

      const tdAud = document.createElement('td');
      const aud = row.auditorio;
      if(!aud){
        tdAud.innerHTML = '<div class="auditorio-cell"><div class="au-dash">—</div></div>';
      } else if(aud.special){
        tdAud.innerHTML = `<div class="auditorio-cell"><div class="au-item"><div class="au-code">${escapeHtml(row.time)}</div><div class="au-title au-tbd">${escapeHtml(aud.text)}</div></div></div>`;
      } else if(aud.cms){
        const items = aud.cms.map(cm=>`<div class="au-item"><div class="au-code">${escapeHtml(cm.code)} · ${escapeHtml(cm.time)}</div><div class="au-title">${escapeHtml(cm.title)}</div><div class="au-speaker${cm.speaker==='Por confirmar'?' au-tbd':''}">${escapeHtml(cm.speaker)}</div></div>`).join('');
        tdAud.innerHTML = `<div class="auditorio-cell">${items}</div>`;
      }
      tr.appendChild(tdAud);

      if(row.altBlock){
        const td = document.createElement('td');
        td.colSpan = day.rooms.length;
        if(row.altBlock.span) td.rowSpan = row.altBlock.span;
        td.style.background = 'rgba(212,160,23,0.08)';
        td.style.borderLeft = '3px solid var(--gold)';
        td.style.verticalAlign = 'middle';
        td.style.padding = '14px 16px';
        td.innerHTML = (row.altBlock.time?`<div style="font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);opacity:.8;margin-bottom:2px;">${escapeHtml(row.altBlock.time)}</div>`:'')
          + `<div style="font-family:'Playfair Display',serif;color:var(--gold);font-size:13px;">${escapeHtml(row.altBlock.title)}</div>
          <div style="font-size:11px;color:var(--text-dim);margin-top:4px;">${escapeHtml(row.altBlock.sub)}</div>`;
        tr.appendChild(td);
      } else if(row.altBlockContinuation){
        // covered by rowSpan from a previous row — no cell here
      } else if(row.posterBatch){
        const td = document.createElement('td');
        td.colSpan = day.rooms.length;
        const PSTATUS_ICON = {confirmado:'🟢', parcial:'🟡', pendiente:'⚪'};
        const hasSalon=row.posterBatch.some(p=>p.salon);
        if(hasSalon){
          const salones=[...new Set(row.posterBatch.map(p=>p.salon||'Sin asignar'))].sort();
          const cols=salones.map(s=>{
            const items=row.posterBatch.filter(p=>p.salon===s);
            const listHtml=items.map(p=>`<div class="p-item">${PSTATUS_ICON[p.status]||''} <b>${escapeHtml(p.title)}</b><br><span style="opacity:.7">${escapeHtml(p.authors)}</span></div>`).join('');
            return `<div style="flex:1;min-width:0"><div class="pm-title">Salón ${escapeHtml(s)} &mdash; ${items.length} pósters</div><details><summary>Ver listado</summary><div class="poster-list">${listHtml}</div></details></div>`;
          }).join('<div style="width:1px;background:var(--border);margin:0 10px"></div>');
          td.innerHTML=`<div class="poster-merged-cell" style="display:flex;gap:0">${cols}</div>`;
        } else {
          const listHtml=row.posterBatch.map(p=>`<div class="p-item">${PSTATUS_ICON[p.status]||''} <b>${escapeHtml(p.title)}</b><br>${escapeHtml(p.authors)}${p.note?`<br><i>${escapeHtml(p.note)}</i>`:''}</div>`).join('');
          td.innerHTML=`<div class="poster-merged-cell"><div class="pm-title">${row.posterBatch.length} pósters en exhibición</div><details><summary>Ver listado completo</summary><div class="poster-list">${listHtml}</div></details></div>`;
        }
        tr.appendChild(td);
      } else {
        day.rooms.forEach(room=>{
          const td = document.createElement('td');
          const items = (row.cells && row.cells[room]) || [];
          if(items.length===0){
            td.innerHTML = '<div class="cell empty">— cerrado —</div>';
          } else {
            const stack = document.createElement('div');
            stack.className = 'cell-stack';
            items.forEach(cell=>{
              const div = document.createElement('div');
              div.className = 'cell ' + (cell.status||'pendiente') + (cell.dup?' dup':'');
              let meta = STATUS_LABEL[cell.status];
              if(cell.status==='confirmado' || cell.status==='parcial'){
                meta = (cell.status==='confirmado' ? '🟢 ' : '🟡 ') + (cell.authors ? cell.authors.split(',')[0] : '');
              } else if(cell.status==='pendiente'){
                meta = '⚪ Pendiente' + (cell.dup ? ' · 🔁 dup' : '');
              } else if(cell.status==='tbd'){
                meta = '🔵 Cupo TBD';
              }
              div.innerHTML = `<div class="title">${escapeHtml(cell.title)}</div><div class="meta">${escapeHtml(meta)}</div>`;
              div.onclick = ()=>openModal(room, cell.time || row.time, cell);
              stack.appendChild(div);
            });
            td.appendChild(stack);
          }
          tr.appendChild(td);
        });
      }
    }
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  panel.appendChild(wrap);
  panelsEl.appendChild(panel);
});

function selectDay(idx){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active', i===idx));
  DAYS.forEach((d,i)=>document.getElementById('panel-'+d.id).classList.toggle('active', i===idx));
}
selectDay(0);

// ===== Modal =====
function openModal(room, time, cell){
  document.getElementById('modalBadge').className = 'badge ' + cell.status;
  document.getElementById('modalBadge').textContent = STATUS_LABEL[cell.status] || cell.status;
  document.getElementById('modalTitle').textContent = cell.title;
  document.getElementById('modalRoom').innerHTML = `<b>Salón / Hora:</b> ${escapeHtml(room)} · ${escapeHtml(time)}`;
  document.getElementById('modalAuthors').innerHTML = cell.authors ? `<b>Autor(es):</b> ${escapeHtml(cell.authors)}` : '';
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){
  document.getElementById('modalBg').classList.remove('show');
}

// ── Tema día/noche ────────────────────────────────────────────────────────────
(function(){
  const saved = localStorage.getItem('stg-theme');
  if(saved === 'day') applyDay();
})();
function applyDay(){
  document.body.classList.add('day-mode');
  const btn = document.getElementById('themeBtn');
  if(btn){
    document.getElementById('themeIcon').textContent = '🌙';
    document.getElementById('themeLabel').textContent = 'Modo noche';
  }
}
function applyNight(){
  document.body.classList.remove('day-mode');
  const btn = document.getElementById('themeBtn');
  if(btn){
    document.getElementById('themeIcon').textContent = '☀️';
    document.getElementById('themeLabel').textContent = 'Modo día';
  }
}
function toggleTheme(){
  if(document.body.classList.contains('day-mode')){
    applyNight();
    localStorage.setItem('stg-theme','night');
  } else {
    applyDay();
    localStorage.setItem('stg-theme','day');
  }
}
</script>
